# Artifacts the kernel factory fetches by hand, pinned by digest; the recipes read them with
# `limen pins get` (book/tooling.md, "Pinned artifacts beyond aqua"). Renovate moves each
# version; the checksum workflow's `limen pins refresh` brings the digest along.
pins:
  # linux-stable's tags on GitHub carry the point releases (torvalds/linux carries mainline
  # only); the sums file kernel.org clearsigns with its autosigner key is the digest source.
  - name: kernel
    renovate: github-tags gregkh/linux
    extract-version: ^v(?<version>[0-9]+\.[0-9]+(?:\.[0-9]+)?)$
    version: 7.2.6
    url: https://cdn.kernel.org/pub/linux/kernel/v${major}.x/linux-${version}.tar.xz
    verify: pgp-sha256sums https://cdn.kernel.org/pub/linux/kernel/v${major}.x/sha256sums.asc https://git.kernel.org/pub/scm/docs/kernel/pgpkeys.git/plain/keys/632D3A06589DA6B1.asc B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1
    digest:
      version: 7.2.6
      sha256: 039aef84f2b0994aeda3f4fcfc3d02ec9d7a9bbb9020ea264c43f446c860f606
  # An exact LLVM release tarball, not apt's clang-NN, which keeps only the newest build per
  # major. LLVM's own release workflow attests the asset (SLSA provenance).
  - name: llvm
    renovate: github-releases llvm/llvm-project
    extract-version: ^llvmorg-(?<version>[0-9]+\.[0-9]+\.[0-9]+)$
    version: 23.1.2
    url: https://github.com/llvm/llvm-project/releases/download/llvmorg-${version}/LLVM-${version}-Linux-ARM64.tar.xz
    verify: github-attestation llvm
    digest:
      version: 23.1.2
      sha256: 075da47cb832273717d4c7bad4b6b4848d7c154262e9ba0dcc0025426d4073f0
  # Kata's bootstrap kernel: the cold-start seed for the very first build VM, never fetched
  # again once the factory self-hosts. GitHub attests the asset as an immutable release.
  - name: kata
    renovate: github-releases kata-containers/kata-containers
    version: 4.2.0
    url: https://github.com/kata-containers/kata-containers/releases/download/${version}/kata-static-${version}-arm64.tar.zst
    verify: github-release-asset kata-containers/kata-containers
    digest:
      version: 4.2.0
      sha256: 5dd4e9f2d5ea9e6bdfa2f476b3315335b58252366fcda2775a3094fc8fec376b
